name: Mobile quality
on:
  push:
    paths: ['mobile-app/**', '.github/workflows/mobile-quality.yml']
  pull_request:
    paths: ['mobile-app/**', '.github/workflows/mobile-quality.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run export:android
        env:
          CI: '1'
