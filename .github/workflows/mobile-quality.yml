name: Mobile quality
on:
  push:
    paths: ['mobile-app/**', 'docs/api/**', 'docs/test-rider-journey.md', '.github/workflows/mobile-quality.yml']
  pull_request:
    paths: ['mobile-app/**', 'docs/api/**', 'docs/test-rider-journey.md', '.github/workflows/mobile-quality.yml']
permissions:
  contents: read
concurrency:
  group: mobile-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile-app
    env:
      CI: '1'
      EXPO_PUBLIC_APP_ENV: development
      EXPO_PUBLIC_DATA_MODE: mock
      EXPO_PUBLIC_PUSH_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run check:expo
      - run: npm run export:android
      - run: npm run export:web
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
